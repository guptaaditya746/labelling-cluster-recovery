[project]
name = "labelling"
version = "0.1.0"
description = "Gold-set construction for the Research Harness: evidence documents (D), Argilla review, export."
requires-python = ">=3.12"
dependencies = [
    "argilla>=2.8,<3",
    "pydantic>=2.7",
    "tqdm>=4.66",
]

[project.scripts]
labelling = "labelling.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labelling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
